name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rental-saas-backend
  DEPLOY_USER: deploy
  HEALTH_CHECK_URL: https://${{ vars.DEPLOY_HOST }}/api/v1/healthz
  HEALTH_RETRIES: 10
  HEALTH_INTERVAL: 5

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      short-sha: ${{ steps.short-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: short-sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: rental-saas-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE_TAG: sha-${{ needs.build-and-push.outputs.short-sha }}
        run: |
          ssh ${{ env.DEPLOY_USER }}@${DEPLOY_HOST} \
            "cd /opt/rental-saas && \
             docker compose pull backend && \
             BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
             docker compose up -d --no-deps backend && \
             docker image prune -f"

      - name: Health check
        run: |
          for i in $(seq 1 ${{ env.HEALTH_RETRIES }}); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" ${{ env.HEALTH_CHECK_URL }} || echo "000")
            echo "Attempt ${i}/${HEALTH_RETRIES}: HTTP ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            sleep ${{ env.HEALTH_INTERVAL }}
          done
          echo "Health check failed after ${{ env.HEALTH_RETRIES }} attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          echo "Deployment failed — rolling back..."
          ssh ${{ env.DEPLOY_USER }}@${DEPLOY_HOST} \
            "cd /opt/rental-saas && \
             docker compose up -d --no-deps backend" || true

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>DEPLOY THÀNH CÔNG</b>%0A━━━━━━━━━━━━━━━━━━━━%0A🔀 Branch: ${{ github.ref_name }}%0A📝 Commit: ${{ needs.build-and-push.outputs.short-sha }}%0A👤 By: ${{ github.actor }}%0A🕐 $(date '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>DEPLOY THẤT BẠI</b>%0A━━━━━━━━━━━━━━━━━━━━%0A🔀 Branch: ${{ github.ref_name }}%0A📝 Commit: ${{ needs.build-and-push.outputs.short-sha }}%0A👤 By: ${{ github.actor }}%0AXem logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
