name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-saas-backend/package-lock.json

      - name: Install dependencies
        working-directory: rental-saas-backend
        run: npm ci

      - name: Lint
        working-directory: rental-saas-backend
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-saas-backend/package-lock.json

      - name: Install dependencies
        working-directory: rental-saas-backend
        run: npm ci

      - name: Type check
        working-directory: rental-saas-backend
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: rental-saas-backend/package-lock.json

      - name: Install dependencies
        working-directory: rental-saas-backend
        run: npm ci

      - name: Run tests
        working-directory: rental-saas-backend
        run: npm test -- --passWithNoTests

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: rental-saas-backend
          push: false
          tags: rental-saas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
